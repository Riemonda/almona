name: Build Almona APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Almona APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q almona.zip -d project

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find project -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.41.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert --version

      - name: Configure Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          # =========================================================
          # 1. Android build configuration
          # =========================================================

          build_file = Path("android/app/build.gradle.kts")

          if not build_file.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts not found"
              )

          text = build_file.read_text()

          # Android SDK 35
          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 35"
          )

          # Java 17
          text = text.replace(
              "sourceCompatibility = JavaVersion.VERSION_11",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )

          text = text.replace(
              "targetCompatibility = JavaVersion.VERSION_11",
              "targetCompatibility = JavaVersion.VERSION_17"
          )

          text = text.replace(
              "jvmTarget = JavaVersion.VERSION_11.toString()",
              "jvmTarget = JavaVersion.VERSION_17.toString()"
          )

          # =========================================================
          # 2. Core Library Desugaring
          # =========================================================

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              marker = "    compileOptions {"

              if marker in text:
                  text = text.replace(
                      marker,
                      """    compileOptions {
          isCoreLibraryDesugaringEnabled = true""",
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: compileOptions block not found"
                  )

          dependency = (
              '    coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.5"'
              ')'
          )

          if "desugar_jdk_libs" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n" + dependency,
                      1
                  )
              else:
                  text += (
                      "\n\ndependencies {\n"
                      + dependency
                      + "\n}\n"
                  )

          build_file.write_text(text)

          # =========================================================
          # 3. Kotlin
          # =========================================================

          settings_file = Path("android/settings.gradle.kts")

          if not settings_file.exists():
              raise SystemExit(
                  "ERROR: android/settings.gradle.kts not found"
              )

          settings = settings_file.read_text()

          settings = settings.replace(
              'id("org.jetbrains.kotlin.android") version "1.8.22" apply false',
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false'
          )

          settings_file.write_text(settings)

          # =========================================================
          # 4. Check Almona logo
          # =========================================================

          logo = Path("assets/images/almona.png")

          if not logo.exists():
              raise SystemExit(
                  "ERROR: assets/images/almona.png was not found."
              )

          print("Almona logo found:")
          print(logo)

          # =========================================================
          # 5. Remove old launcher resources
          # =========================================================

          res_dir = Path("android/app/src/main/res")

          old_files = [
              res_dir / "drawable" / "ic_launcher.xml",
              res_dir / "drawable" / "ic_launcher.png",
          ]

          for old_file in old_files:
              if old_file.exists():
                  old_file.unlink()
                  print(f"Removed {old_file}")

          # =========================================================
          # 6. Create Adaptive Icon directories
          # =========================================================

          adaptive_dir = res_dir / "mipmap-anydpi-v26"
          adaptive_dir.mkdir(parents=True, exist_ok=True)

          drawable_dir = res_dir / "drawable"
          drawable_dir.mkdir(parents=True, exist_ok=True)

          # =========================================================
          # 7. Create Adaptive Icon foreground
          #
          # 108x108 canvas
          # Almona logo enlarged to approximately 90%
          # Transparent outside the logo
          # =========================================================

          foreground = drawable_dir / "ic_launcher_foreground.png"

          subprocess.run(
              [
                  "convert",
                  str(logo),
                  "-background",
                  "none",
                  "-resize",
                  "97x97",
                  "-gravity",
                  "center",
                  "-extent",
                  "108x108",
                  str(foreground),
              ],
              check=True,
          )

          print(
              "Created Adaptive Icon foreground:",
              foreground
          )

          # =========================================================
          # 8. Create Adaptive Icon XML
          #
          # Android 8+ / Android 13
          # Background uses Almona green.
          # Foreground uses the real Almona logo.
          # =========================================================

          adaptive_icon = adaptive_dir / "ic_launcher.xml"

          adaptive_icon.write_text(
              """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/almona_icon_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          """
          )

          print(
              "Created Adaptive Icon:",
              adaptive_icon
          )

          # =========================================================
          # 9. Create launcher background color
          # =========================================================

          values_dir = res_dir / "values"
          values_dir.mkdir(parents=True, exist_ok=True)

          colors_file = values_dir / "colors.xml"

          existing_colors = ""

          if colors_file.exists():
              existing_colors = colors_file.read_text()

          if "almona_icon_background" not in existing_colors:

              if "<resources>" in existing_colors:

                  existing_colors = existing_colors.replace(
                      "<resources>",
                      """<resources>
              <color name="almona_icon_background">#00C896</color>""",
                      1
                  )

                  colors_file.write_text(existing_colors)

              else:

                  colors_file.write_text(
                      """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="almona_icon_background">#00C896</color>
          </resources>
          """
                  )

          print("Adaptive Icon background configured.")

          # =========================================================
          # 10. Legacy launcher icons
          #
          # Used by older Android versions.
          # The same Almona logo is used.
          # =========================================================

          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          print("Generating legacy launcher icons...")

          for density, size in densities.items():

              directory = res_dir / f"mipmap-{density}"
              directory.mkdir(parents=True, exist_ok=True)

              icon = directory / "ic_launcher.png"

              logo_size = int(size * 0.90)

              subprocess.run(
                  [
                      "convert",
                      str(logo),
                      "-background",
                      "none",
                      "-resize",
                      f"{logo_size}x{logo_size}",
                      "-gravity",
                      "center",
                      "-extent",
                      f"{size}x{size}",
                      str(icon),
                  ],
                  check=True,
              )

              print(
                  f"Created legacy icon: {icon}"
              )

          # =========================================================
          # 11. Update AndroidManifest.xml
          # =========================================================

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found"
              )

          manifest_text = manifest.read_text()

          # Remove previous icon declarations if present.
          manifest_text = manifest_text.replace(
              'android:icon="@drawable/ic_launcher"',
              ''
          )

          manifest_text = manifest_text.replace(
              'android:icon="@mipmap/ic_launcher"',
              ''
          )

          # Add Adaptive Icon launcher reference.
          if "<application" in manifest_text:

              manifest_text = manifest_text.replace(
                  "<application",
                  '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"',
                  1
              )

          else:
              raise SystemExit(
                  "ERROR: application tag not found."
              )

          manifest.write_text(manifest_text)

          print("AndroidManifest.xml updated.")
          print("Adaptive Icon configuration completed successfully.")
          PY

      - name: Verify Android configuration
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "========================================"
          echo "Android configuration verification"
          echo "========================================"

          echo ""
          echo "compileSdk:"
          grep -n "compileSdk" android/app/build.gradle.kts || true

          echo ""
          echo "Java / Desugaring:"
          grep -n "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts || true
          grep -n "desugar_jdk_libs" android/app/build.gradle.kts || true

          echo ""
          echo "Kotlin:"
          grep -n "kotlin.android" android/settings.gradle.kts || true

          echo ""
          echo "Manifest:"
          grep -n "android:icon" android/app/src/main/AndroidManifest.xml || true
          grep -n "android:roundIcon" android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "Adaptive Icon:"
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable/ic_launcher_foreground.png

          echo "Adaptive Icon files exist."

          echo ""
          echo "Launcher background:"
          grep -n "almona_icon_background" android/app/src/main/res/values/colors.xml || true

          echo ""
          echo "Legacy icons:"

          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "All launcher icons exist."

          echo ""
          echo "Almona logo:"
          test -f assets/images/almona.png

          echo "Almona logo exists."

      - name: Flutter clean
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter clean

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almona-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
