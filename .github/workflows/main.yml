name: Build Almona APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Almona
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q almona.zip -d project

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find project -type f -name pubspec.yaml | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Fix intl version in pubspec.yaml
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          sed -i 's/intl: \^0.20.2/intl: \^0.19.0/g' pubspec.yaml
          echo "✅ Fixed intl version in pubspec.yaml"

      - name: Fix Android build configuration
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          # تعديل build.gradle لإضافة NDK version و desugaring
          ANDROID_APP_GRADLE="${{ steps.project.outputs.dir }}/android/app/build.gradle"
          
          if [ -f "$ANDROID_APP_GRADLE" ]; then
            # إضافة ndkVersion إذا لم تكن موجودة
            if ! grep -q "ndkVersion" "$ANDROID_APP_GRADLE"; then
              sed -i '/android {/a\    ndkVersion = "27.0.12077973"' "$ANDROID_APP_GRADLE"
            fi
            
            # إضافة desugaring في defaultConfig
            if ! grep -q "multiDexEnabled" "$ANDROID_APP_GRADLE"; then
              sed -i '/defaultConfig {/a\        multiDexEnabled true' "$ANDROID_APP_GRADLE"
            fi
            
            # إضافة coreLibraryDesugaring في dependencies
            if ! grep -q "coreLibraryDesugaring" "$ANDROID_APP_GRADLE"; then
              sed -i '/dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' "$ANDROID_APP_GRADLE"
            fi
            
            echo "✅ Fixed Android build.gradle"
          fi

          # تعديل build.gradle.kts إذا كان موجوداً
          ANDROID_APP_GRADLE_KTS="${{ steps.project.outputs.dir }}/android/app/build.gradle.kts"
          if [ -f "$ANDROID_APP_GRADLE_KTS" ]; then
            if ! grep -q "ndkVersion" "$ANDROID_APP_GRADLE_KTS"; then
              sed -i '/android {/a\    ndkVersion = "27.0.12077973"' "$ANDROID_APP_GRADLE_KTS"
            fi
            echo "✅ Fixed Android build.gradle.kts"
          fi

      - name: Update Android build.gradle (manual fix)
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cat > android/app/build.gradle << 'EOF'
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
          }

          def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
          if (flutterVersionCode == null) {
              flutterVersionCode = '1'
          }

          def flutterVersionName = localProperties.getProperty('flutter.versionName')
          if (flutterVersionName == null) {
              flutterVersionName = '1.0'
          }

          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

          android {
              ndkVersion = "27.0.12077973"
              
              compileSdk = 34

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = '1.8'
              }

              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }

              defaultConfig {
                  applicationId = "com.example.almona"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
          }
          EOF
          
          echo "✅ Replaced build.gradle with fixed version"

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almona-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
