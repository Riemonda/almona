name: Build Almona APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Almona APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q almona.zip -d project

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find project -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.41.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Configure Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ---------------------------------------------------------
          # 1. app/build.gradle.kts
          # ---------------------------------------------------------

          build_file = Path("android/app/build.gradle.kts")

          if not build_file.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts not found"
              )

          text = build_file.read_text()

          # Android SDK 35
          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 35"
          )

          # Java 17
          text = text.replace(
              "sourceCompatibility = JavaVersion.VERSION_11",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )

          text = text.replace(
              "targetCompatibility = JavaVersion.VERSION_11",
              "targetCompatibility = JavaVersion.VERSION_17"
          )

          text = text.replace(
              "jvmTarget = JavaVersion.VERSION_11.toString()",
              "jvmTarget = JavaVersion.VERSION_17.toString()"
          )

          # Core Library Desugaring
          if "isCoreLibraryDesugaringEnabled = true" not in text:
              marker = "    compileOptions {"

              if marker in text:
                  text = text.replace(
                      marker,
                      """    compileOptions {
              isCoreLibraryDesugaringEnabled = true""",
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: compileOptions block not found"
                  )

          # Desugaring dependency
          dependency = (
              '    coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.5"'
              ')'
          )

          if "desugar_jdk_libs" not in text:

              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n" + dependency,
                      1
                  )
              else:
                  text += (
                      "\n\ndependencies {\n"
                      + dependency
                      + "\n}\n"
                  )

          build_file.write_text(text)

          # ---------------------------------------------------------
          # 2. settings.gradle.kts
          # ---------------------------------------------------------

          settings_file = Path("android/settings.gradle.kts")

          if not settings_file.exists():
              raise SystemExit(
                  "ERROR: android/settings.gradle.kts not found"
              )

          settings = settings_file.read_text()

          # Flutter 3.41.7 requires a modern Kotlin version.
          settings = settings.replace(
              'id("org.jetbrains.kotlin.android") version "1.8.22" apply false',
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false'
          )

          settings_file.write_text(settings)

          # ---------------------------------------------------------
          # 3. Android launcher icon
          # ---------------------------------------------------------

          drawable_dir = Path(
              "android/app/src/main/res/drawable"
          )

          drawable_dir.mkdir(parents=True, exist_ok=True)

          icon_file = drawable_dir / "ic_launcher.xml"

          icon_file.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#4CAF50"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,18
                  C34.12,18 18,34.12 18,54
                  C18,73.88 34.12,90 54,90
                  C73.88,90 90,73.88 90,54
                  C90,34.12 73.88,18 54,18 Z

                  M54,28
                  C68.36,28 80,39.64 80,54
                  C80,68.36 68.36,80 54,80
                  C39.64,80 28,68.36 28,54
                  C28,39.64 39.64,28 54,28 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M48,38 L60,38 L60,70 L48,70 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M38,48 L70,48 L70,60 L38,60 Z" />

          </vector>
          """)

          # ---------------------------------------------------------
          # 4. Fix AndroidManifest icon
          # ---------------------------------------------------------

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found"
              )

          manifest_text = manifest.read_text()

          manifest_text = manifest_text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/ic_launcher"'
          )

          manifest.write_text(manifest_text)

          print("Android configuration completed successfully.")
          PY

      - name: Verify Android configuration
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "========================================"
          echo "Android build configuration"
          echo "========================================"

          grep -n "compileSdk" android/app/build.gradle.kts || true
          grep -n "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts || true
          grep -n "desugar_jdk_libs" android/app/build.gradle.kts || true
          grep -n "kotlin.android" android/settings.gradle.kts || true
          grep -n "android:icon" android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "Checking launcher icon..."

          test -f android/app/src/main/res/drawable/ic_launcher.xml

          echo "Launcher icon exists."

      - name: Flutter clean
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter clean

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almona-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
