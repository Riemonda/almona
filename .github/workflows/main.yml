name: Build Almona APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Almona APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q almona.zip -d project

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          PUBSPEC=$(find project -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.41.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Configure Android project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # =========================================================
          # 1. android/app/build.gradle.kts
          # =========================================================

          build_file = Path("android/app/build.gradle.kts")

          if not build_file.exists():
              raise SystemExit(
                  "ERROR: android/app/build.gradle.kts not found"
              )

          text = build_file.read_text()

          # Android SDK 35
          text = text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 35"
          )

          # Java 17
          text = text.replace(
              "sourceCompatibility = JavaVersion.VERSION_11",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )

          text = text.replace(
              "targetCompatibility = JavaVersion.VERSION_11",
              "targetCompatibility = JavaVersion.VERSION_17"
          )

          text = text.replace(
              "jvmTarget = JavaVersion.VERSION_11.toString()",
              "jvmTarget = JavaVersion.VERSION_17.toString()"
          )

          # Core Library Desugaring
          if "isCoreLibraryDesugaringEnabled = true" not in text:
              marker = "    compileOptions {"

              if marker in text:
                  text = text.replace(
                      marker,
                      """    compileOptions {
          isCoreLibraryDesugaringEnabled = true""",
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: compileOptions block not found"
                  )

          # Desugaring dependency
          dependency = (
              '    coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.5"'
              ')'
          )

          if "desugar_jdk_libs" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n" + dependency,
                      1
                  )
              else:
                  text += (
                      "\n\ndependencies {\n"
                      + dependency
                      + "\n}\n"
                  )

          build_file.write_text(text)

          # =========================================================
          # 2. android/settings.gradle.kts
          # =========================================================

          settings_file = Path("android/settings.gradle.kts")

          if not settings_file.exists():
              raise SystemExit(
                  "ERROR: android/settings.gradle.kts not found"
              )

          settings = settings_file.read_text()

          settings = settings.replace(
              'id("org.jetbrains.kotlin.android") version "1.8.22" apply false',
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false'
          )

          settings_file.write_text(settings)

          # =========================================================
          # 3. Find Almona logo
          # =========================================================

          logo = Path("assets/images/almona.png")

          if not logo.exists():
              raise SystemExit(
                  "ERROR: assets/images/almona.png was not found."
              )

          print("Almona logo found:")
          print(logo)

          # =========================================================
          # 4. Remove old manually-created launcher icon
          # =========================================================

          old_icon = Path(
              "android/app/src/main/res/drawable/ic_launcher.xml"
          )

          if old_icon.exists():
              old_icon.unlink()
              print("Removed old ic_launcher.xml")

          # =========================================================
          # 5. Prepare Android mipmap directories
          # =========================================================

          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          res_dir = Path("android/app/src/main/res")

          for density, size in densities.items():
              directory = res_dir / f"mipmap-{density}"
              directory.mkdir(parents=True, exist_ok=True)

          # =========================================================
          # 6. Generate launcher PNGs from almona.png
          # =========================================================

          print("Generating Android launcher icons...")

          for density, size in densities.items():
              directory = res_dir / f"mipmap-{density}"

              icon = directory / "ic_launcher.png"

              import subprocess

              subprocess.run(
                  [
                      "convert",
                      str(logo),
                      "-resize",
                      f"{size}x{size}",
                      "-background",
                      "none",
                      "-gravity",
                      "center",
                      "-extent",
                      f"{size}x{size}",
                      str(icon),
                  ],
                  check=True,
              )

              print(
                  f"Created {icon} ({size}x{size})"
              )

          # =========================================================
          # 7. Update AndroidManifest.xml
          # =========================================================

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "ERROR: AndroidManifest.xml not found"
              )

          manifest_text = manifest.read_text()

          manifest_text = manifest_text.replace(
              'android:icon="@drawable/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )

          if 'android:icon="@mipmap/ic_launcher"' not in manifest_text:
              if "<application" in manifest_text:
                  manifest_text = manifest_text.replace(
                      "<application",
                      '<application android:icon="@mipmap/ic_launcher"',
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: application tag not found."
                  )

          manifest.write_text(manifest_text)

          print("AndroidManifest.xml updated.")

          # =========================================================
          # 8. Remove obsolete drawable launcher files
          # =========================================================

          for file in [
              Path("android/app/src/main/res/drawable/ic_launcher.png"),
              Path("android/app/src/main/res/drawable/ic_launcher.xml"),
          ]:
              if file.exists():
                  file.unlink()

          print("Android configuration completed successfully.")
          PY

      - name: Verify Android configuration
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "========================================"
          echo "Android build configuration"
          echo "========================================"

          echo ""
          echo "compileSdk:"
          grep -n "compileSdk" android/app/build.gradle.kts || true

          echo ""
          echo "Java / Desugaring:"
          grep -n "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts || true
          grep -n "desugar_jdk_libs" android/app/build.gradle.kts || true

          echo ""
          echo "Kotlin:"
          grep -n "kotlin.android" android/settings.gradle.kts || true

          echo ""
          echo "Manifest icon:"
          grep -n "android:icon" android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "Checking Almona launcher icons..."

          test -f assets/images/almona.png

          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo ""
          echo "Almona launcher icons exist successfully."

      - name: Flutter clean
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter clean

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almona-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
